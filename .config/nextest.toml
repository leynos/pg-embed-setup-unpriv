# .config/nextest.toml
[profile.default]
# Default slow timeout is 180s; nextest sends SIGTERM after the period and
# SIGKILL after the grace-period. The settings integration test binary
# (`tests/settings.rs`) is capped at 30s.
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }

# Put a hard ceiling on the whole run.
global-timeout = "10m"

[[profile.default.overrides]]
filter = "binary(=settings)"
slow-timeout = { period = "30s", terminate-after = 1, grace-period = "5s" }

# The `ui` binary is a trybuild test: it compiles the whole crate afresh in a
# scratch directory, which can exceed the default 180s on cold, slow runners
# (notably macOS). Allow it more headroom while staying under `global-timeout`.
#
# Measured on the macOS test leg (it keeps the sccache wrapper, which makes the
# nested builds slow): the three slow `ui` tests took 299.9, 313.3 and 316.0 s
# on the pre-adoption run of #314, and 291.7, 293.4 and 298.7 s on job
# 111315793594, so a 360 s budget left them about 12 to 17 percent of headroom
# and a slower runner timed them out at 360.0 s. 450 s keeps a real hang failing
# and, started up to about 90 s into the run, still ends inside `global-timeout`.
[[profile.default.overrides]]
filter = "binary(=ui)"
slow-timeout = { period = "450s", terminate-after = 1, grace-period = "5s" }

[test-groups]
serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
  binary(=bootstrap_privileges)
  | binary(=database_lifecycle)
  | binary(=observability)
  | binary(=password_reuse_e2e)
  | binary(=settings_logging)
  | binary(=test_cluster_behaviour)
  | binary(=test_cluster_connection)
  | binary(=test_cluster_drop)
"""
test-group = "serial"
